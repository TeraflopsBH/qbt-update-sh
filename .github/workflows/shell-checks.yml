name: Shell script checks

on:
  push:
    branches:
      - main
      - 'fix/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Bash syntax
        run: bash -n qbtupd.sh

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: .
          severity: warning
