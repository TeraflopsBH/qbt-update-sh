name: Shell script checks

on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Check Bash syntax
        run: bash -n qbtupd.sh

      - name: Run ShellCheck
        run: shellcheck -x qbtupd.sh tests/test_dietpi_software_state.sh tests/test_menu_cancellation.sh tests/test_status_formatting.sh tests/test_pipe_execution.sh

      - name: Test DietPi software state parsing
        run: bash tests/test_dietpi_software_state.sh

      - name: Test menu cancellation routing
        run: bash tests/test_menu_cancellation.sh

      - name: Test status badge formatting
        run: bash tests/test_status_formatting.sh

      - name: Test piped execution and sourcing
        run: bash tests/test_pipe_execution.sh
